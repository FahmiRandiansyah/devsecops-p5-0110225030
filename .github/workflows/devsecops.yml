name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Unit Tests
        run: |
          pytest --verbose

  sast-scan:
    name: SAST Security Scan & Quality Gate
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install SAST Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit SAST Analysis
        run: |
          echo "=== Menjalankan SAST Scan dengan Bandit ==="
          bandit -r src/ main.py -f custom --msg-template "{abspath}:{line}: [{severity}] {test_id}: {msg}" || true

      - name: Quality Gate Check
        run: |
          echo "=== Evaluasi Quality Gate (Fail pada Medium/High Severity) ==="
          # Flag -lll menyaring Medium/High Severity, -iii menyaring Medium/High Confidence
          bandit -r src/ main.py -lll -iii
